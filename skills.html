<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Set | Portfolio</title> 
    <!-- データの取得 -->
    <script type="module" src="./assets/data/data.js" defer></script>
    <script type="module" src="./assets/js/common/components.js" defer></script>
    <script type="module" src="./assets/js/pages/skills/main.js" defer></script>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/skills.css">
</head>
<body>

    <custom-header></custom-header>
    
    <custom-question>
        <div class="c-question-icon" id="js-question-icon">?</div>
        <div class="p-question" id="js-page-modal">
            <div class="p-question__content">
                <span class="p-question__close" id="js-page-modal-close">&times;</span>
                <h2 class="p-question__title">このページについて</h2>
                <div class="p-question__note">
                    <p>
                        このページでは、私がこれまで使用した技術を紹介しています。
                        <br>各技術には、使用経験やスキルレベル、関連するプロジェクトなどを記載しています。
                        <br>また、資格取得状況、学習状況についてもご紹介します。
                        <br>ぜひご覧ください！
                    </p>
                    <p>詳細情報</p>
                    <ul>
                        <li>レベルは1から5の5段階で自己評価が表示されます</li>
                        <li>使用経験は、実務経験や個人プロジェクトでの使用経験などを含みます</li>
                        <li>各項目、選択することで詳細情報を確認できます</li>
                    </ul>
                </div>    
            </div>
        </div>
    </custom-question>

    <main class="l-main">
        <div class="p-skill-container">
            
            <!-- プログラミング言語 -->
            <div id="LANGUAGES"></div>

            <!-- データベース -->
            <div id="DATABASE"></div>

            <!-- インフラ -->
            <div id="INFRASTRUCTURE"></div>

            <!-- フレームワーク・ライブラリ -->
            <div id="FRAMEWORK-LIBRARY"></div>
                
            <!-- 資格 -->
            <div id="CERTIFICATIONS"></div>
            
        </div>
        <custom-footer></custom-footer>
    </main>

    <div id="skill-modal" class="p-modal">
        <div class="p-modal__content">
            <span class="p-modal__close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>
    
</body>
</html>
