<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works | Portfolio</title> 
    <!-- データの取得とスクリプト -->
    <script type="module" src="./assets/data/data.js" defer></script>
    <script type="module" src="./assets/js/common/components.js" defer></script>
    <script type="module" src="./assets/js/pages/project/main.js" defer></script>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/project.css">
</head>
<body>

    <custom-header></custom-header>

    <custom-question>
        <div class="c-question-icon" id="js-question-icon">?</div>
        <div class="p-question" id="js-page-modal">
            <div class="p-question__content">
                <span class="p-question__close" id="js-page-modal-close">&times;</span>
                <h2 class="p-question__title">このページについて</h2>
                <div class="p-question__note">
                    <p>
                        このページでは、私がこれまでに携わった企業案件と個人制作のプロジェクトを紹介しています。
                        <br>各プロジェクトには、使用した技術や担当した役割、プロジェクトの概要などを記載しています。
                        <br>ぜひご覧ください！</p>
                    <p>詳細情報</p>
                    <ul>
                        <li>プロジェクトの詳細情報の確認</li>
                        <li>使用技術の確認</li>
                        <li>担当した役割の確認</li>
                        <li>GitHub：実際のコードを確認できます</li>
                        <li>Visit Site：プロジェクトのライブデモを確認できます</li>
                    </ul>
                </div>
            </div>
        </div>
    </custom-question>

    <main class="l-main">
        <!-- 企業案件セクション -->
        <section class="p-works">
            <h1 class="p-works__title">Enterprise Projects</h1>
            <div id="WORKS_LIST_BUSINESS" class="p-works__grid">
                <!-- JavaScriptでここにカードが挿入されます -->
            </div>
        </section>
        <!-- 個人制作セクション -->
        <section class="p-works">
            <h1 class="p-works__title">Personal Projects</h1>
            <div id="WORKS_LIST_PERSONAL" class="p-works__grid">
                <!-- JavaScriptでここにカードが挿入されます -->
            </div>
        </section>

        <custom-footer></custom-footer>
    </main>
</body>
</html>
